<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Prompts</title>
  </head>
  <body>
    <div class="app">
      <button class="icon-button open-toggle" id="btn-open">
        <img src="assets/open.svg" alt="Abrir Menu" class="icon" />
      </button>
      <aside class="sidebar">
        <header class="sidebar-header">
          <img src="assets/logo.svg" alt="Logo" class="logo" />

          <button class="icon-button close-toggle" id="btn-collapse">
            <img src="assets/collapse.svg" alt="Fechar Menu" class="icon" />
          </button>
        </header>

        <div class="sidebar-content">
          <div class="search-container">
            <div class="search-box">
              <img src="assets/search.svg" alt="Pesquisar" class="search-icon" />
              <input type="text" class="search-input" placeholder="Pesquisar prompts" />
            </div>

            <button class="btn btn-primary btn-new">Novo prompt</button>
          </div>

          <ul class="prompts-list" id="prompts-list">
            <!-- Lista de prompts aparecerá aqui -->
            <li class="prompt-item">
              <div class="prompt-item-info">
                <div class="prompt-item-title">⚡ Planejamento de tarefas semanais</div>
                <div class="prompt-item-description">Me ajude a organizar minha semana de forma equilibrada. Distribua tarefas profissionais e pessoais em blocos de tempo realistas.</div>
              </div>

              <button class="btn-icon" aria-label="Remover prompt">
                <img src="assets/remove.svg" alt="Remover" class="icon icon-trash" />
              </button>
            </li>
          </ul>
        </div>
       
      </aside>

      <main class="main">
        <header class="main-header">
          <button id="btn-copy" class="btn-outline btn">
            <img src="assets/copy.svg" alt="Copiar" class="icon" />
            <span>Copiar</span>
          </button>

          <button id="btn-save" class="btn-primary btn w-150">Salvar</button>
        </header>

        <div
          data-placeholder="Título do prompt"
          class="editable-wrapper"
          id="title-wrapper"
        >
          <h1 id="prompt-title" class="prompt-title" contenteditable="true">
          </h1>
        </div>

        <div
          data-placeholder="Conteúdo do prompt ..."
          class="editable-wrapper"
          id="content-wrapper"
        >
          <div
            id="prompt-content"
            class="prompt-content"
            contenteditable="true"
          >
          
          </div>
        </div>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
